[project]
name = "rag-bench-lab"
version = "0.1.0"
description = "RAG Benchmark Lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8.0,<2.0",
    "gradio<5.0.0",
    "ragworkbench==0.1.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0,<4.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
